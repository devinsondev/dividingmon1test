name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore DividingMon1Test.sln
      - name: Build
        run: dotnet build DividingMon1Test.sln -c Release --no-restore
      - name: Geometry self-test
        run: dotnet run --project tests/DividingMon1Test.SelfTest/DividingMon1Test.SelfTest.csproj -c Release --no-build --no-restore
